version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: autochek:latest
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/v1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
